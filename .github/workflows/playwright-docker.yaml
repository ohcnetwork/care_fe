name: Playwright Tests (Docker)

# Alternative Playwright workflow using custom Docker image
# This workflow uses the custom Dockerfile.playwright image for testing
# Provides faster execution and better reproducibility

on:
  workflow_dispatch:
    inputs:
      backend_branch:
        description: 'Care backend branch to test against'
        required: false
        default: 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  REACT_CARE_API_URL: http://localhost:9000
  BACKEND_STARTUP_TIMEOUT: 120
  IMAGE_NAME: ghcr.io/${{ github.repository }}/playwright

jobs:
  # Build custom Docker image
  build-image:
    if: github.repository == 'ohcnetwork/care_fe'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.playwright
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Run E2E tests using custom Docker image
  test:
    if: github.repository == 'ohcnetwork/care_fe'
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4

      - name: Set backend branch
        id: backend-branch
        run: |
          BRANCH="${{ github.event.inputs.backend_branch }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="develop"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Checkout care backend 📥
        uses: actions/checkout@v4
        with:
          repository: ohcnetwork/care
          path: care
          ref: ${{ steps.backend-branch.outputs.branch }}

      - name: Start care docker containers 🐳
        run: |
          cd care
          echo DISABLE_RATELIMIT=True >> docker/.local.env
          echo JWKS_BASE64=\"$(cat ../.github/runner-files/jwks.b64.txt)\" >> docker/.local.env
          echo MAX_QUESTIONNAIRE_TEXT_RESPONSE_SIZE=500 >> docker/.local.env
          make docker_config_file=docker-compose.local.yaml up load-fixtures
          cd ..

      - name: Wait for backend to be ready
        run: |
          timeout ${{ env.BACKEND_STARTUP_TIMEOUT }} bash -c '
            until curl -f http://localhost:9000/api/v1/health/ 2>/dev/null; do 
              echo "Waiting for backend..."
              sleep 2
            done
          ' || {
            echo "Backend failed to start"
            exit 1
          }
          echo "Backend is ready!"

      - name: Pull custom Docker image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Playwright tests (Shard ${{ matrix.shard }}/3)
        run: |
          docker run --rm \
            --network host \
            -v $PWD/playwright-report:/workspace/care_fe/playwright-report \
            -v $PWD/test-results:/workspace/care_fe/test-results \
            -e REACT_CARE_API_URL=${{ env.REACT_CARE_API_URL }} \
            -e CI=true \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop backend services
        if: always()
        run: |
          cd care
          make docker_config_file=docker-compose.local.yaml down || true

  # Aggregate results
  report:
    if: always() && github.repository == 'ohcnetwork/care_fe'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-results-shard-*
          path: all-results

      - name: Generate summary
        run: |
          echo "## 🎭 Playwright Test Results (Docker)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed using custom Docker image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Results artifacts are available in the workflow run." >> $GITHUB_STEP_SUMMARY
