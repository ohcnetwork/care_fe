name: Deploy PR Preview to Cloudflare

on:
  workflow_run:
    workflows: ["Build PR Preview"]
    types: [completed]

jobs:
  deploy-preview:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-build-${{ github.event.workflow_run.pull_requests[0].number }}
          path: build/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=pr-${{ github.event.workflow_run.pull_requests[0].number }}

      - name: Comment PR with preview URL
        if: steps.deploy.outputs.pages-deployment-alias-url
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.pages-deployment-alias-url }}';
            const prNumber = ${{ github.event.workflow_run.pull_requests[0].number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `### Preview Deployment Ready\n**URL:** ${deploymentUrl}`
            });
