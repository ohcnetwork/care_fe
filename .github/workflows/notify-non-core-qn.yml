name: Notify Core Team on Non-Core Questions

on:
  issue_comment:
    types: [created]

jobs:
  notify_core_team:
    runs-on: ubuntu-latest
    steps:
      - name: Check and Notify
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commenter = context.payload.comment.user.login;
            const coreUsernames = process.env.ALLOWED_USERNAMES.split(',');
            const isOrgMember = allowedUsernames.includes(commenter);
            if (!isOrgMember) {
              const commentBody = context.payload.comment.body.toLowerCase();
              const questionKeywords = process.env.QUESTION_KEYWORDS.split(',');
              const isQuestion = questionKeywords.some(keyword => commentBody.includes(keyword));
              if (isQuestion) {
                await github.repos.createDispatchEvent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  event_type: 'notify_core_team',
                  client_payload: {
                    issue_number: context.payload.issue.number,
                    repository: context.repo.repo
                  }
                });
                await github.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.issue.number,
                  labels: process.env.QUESTION_LABELS.split(','),
                });
                const slackWebhook = process.env.SLACK_WEBHOOK;
                const issueUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${context.payload.issue.number}`;
                const message = {
                  text: `A non-core member posted a question: ${issueUrl}`
                };
                await fetch(slackWebhook, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(message)
                });
              }
            }
