name: Playwright Tests

# This workflow runs Playwright E2E tests with backend integration
# - Triggers on push to main branches and PRs
# - Uses path filtering to skip unnecessary runs
# - Runs tests in parallel using shards
# - Caches Docker images and Playwright browsers
# - Provides detailed test reports as artifacts

on:
  push:
    branches: [main, develop, production, playwright-actions]
  pull_request:
    branches: [develop, production, "3.1/**"]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "CARE backend branch, tag, or commit (overrides the companion default)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  REACT_CARE_API_URL: http://localhost:9000
  REACT_ENABLE_QUESTIONNAIRE_DRAFT: "true"
  BACKEND_STARTUP_TIMEOUT: 120
  TEST_SHARDS: 3
  # Questionnaire actions require this companion backend. Restore develop
  # once that dependency lands, independently of the frontend branch name.
  CARE_BACKEND_REF: ENG-737-backup

jobs:
  # Detect if test-related files changed
  changes:
    if: github.repository == 'ohcnetwork/care_fe'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tests == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            tests:
              - 'tests/**'
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - '.github/workflows/playwright.yaml'

  # Build application once and cache for all test shards
  build:
    if: "!cancelled() && github.repository == 'ohcnetwork/care_fe' && needs.changes.outputs.tests == 'true'"
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Save build and node_modules to cache
        uses: actions/cache/save@v4
        with:
          path: |
            build/
            node_modules/
          key: build-${{ github.sha }}

  # Build the CARE backend image and a migrated, fixture-loaded DB snapshot
  # once per backend revision, so test shards restore them instead of each
  # building the image and running every migration from scratch.
  backend:
    if: "!cancelled() && github.repository == 'ohcnetwork/care_fe' && needs.changes.outputs.tests == 'true'"
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.keys.outputs.sha }}
      image-key: ${{ steps.keys.outputs.image }}
      db-key: ${{ steps.keys.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout care
        uses: actions/checkout@v4
        with:
          repository: ohcnetwork/care
          path: care
          ref: ${{ inputs.backend_ref || env.CARE_BACKEND_REF }}

      - name: Compute cache keys
        id: keys
        run: |
          sha=$(git -C care rev-parse HEAD)
          {
            echo "sha=$sha"
            # The image only bakes in dependencies; the source is bind-mounted.
            echo "image=${{ runner.os }}-care-image-v1-${{ hashFiles('care/Pipfile.lock', 'care/docker/dev.Dockerfile', 'care/plug_config.py', 'care/install_plugins.py') }}"
            # The DB depends on the backend code (migrations, fixtures, synced data).
            echo "db=${{ runner.os }}-care-db-v1-${sha}-${{ hashFiles('.github/runner-files/care-backend.sh') }}"
          } >> "$GITHUB_OUTPUT"

      - name: Look up DB snapshot
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/care-db
          key: ${{ steps.keys.outputs.db }}
          lookup-only: true

      - name: Restore backend image
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/care-image
          key: ${{ steps.keys.outputs.image }}
          # Only download the image when it is needed to build the snapshot.
          lookup-only: ${{ steps.db-cache.outputs.cache-hit == 'true' }}

      - name: Build backend image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: bash .github/runner-files/care-backend.sh build

      - name: Save backend image
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/care-image
          key: ${{ steps.keys.outputs.image }}

      - name: Build DB snapshot
        if: steps.db-cache.outputs.cache-hit != 'true'
        run: |
          bash .github/runner-files/care-backend.sh configure
          bash .github/runner-files/care-backend.sh snapshot
        env:
          JWKS_BASE64: ${{ secrets.JWKS_BASE64 }}

      - name: Save DB snapshot
        if: steps.db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/care-db
          key: ${{ steps.keys.outputs.db }}

      - name: Stop backend
        if: always()
        run: bash .github/runner-files/care-backend.sh stop

  # Run E2E tests with backend integration
  test:
    if: "!cancelled() && github.repository == 'ohcnetwork/care_fe' && needs.changes.outputs.tests == 'true'"
    needs: [changes, build, backend]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout care
        uses: actions/checkout@v4
        with:
          repository: ohcnetwork/care
          path: care
          # Use the exact revision the snapshot was built from.
          ref: ${{ needs.backend.outputs.sha || inputs.backend_ref || env.CARE_BACKEND_REF }}

      # If either cache is missing, the start script falls back to building
      # the image / running migrations + fixtures, like before.
      - name: Restore backend image
        if: needs.backend.outputs.image-key != ''
        uses: actions/cache/restore@v4
        with:
          path: /tmp/care-image
          key: ${{ needs.backend.outputs.image-key }}

      - name: Restore DB snapshot
        if: needs.backend.outputs.db-key != ''
        uses: actions/cache/restore@v4
        with:
          path: /tmp/care-db
          key: ${{ needs.backend.outputs.db-key }}

      # Runs in the background while Node, the build and Playwright are set up.
      - name: Start care backend
        run: |
          bash .github/runner-files/care-backend.sh configure
          bash .github/runner-files/care-backend.sh start-bg
        env:
          JWKS_BASE64: ${{ secrets.JWKS_BASE64 }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restore build cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/
            node_modules/
          key: build-${{ github.sha }}

      - name: Retry cache restore after delay
        if: steps.cache-restore.outputs.cache-hit != 'true'
        id: cache-retry
        run: |
          echo "Cache miss on first attempt, waiting 30s for propagation..."
          sleep 30

      - name: Restore build cache (retry)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        id: cache-restore-retry
        uses: actions/cache/restore@v4
        with:
          path: |
            build/
            node_modules/
          key: build-${{ github.sha }}

      - name: Verify build exists
        run: |
          if [ ! -f build/index.html ]; then
            echo "::error::Build not found after cache restore attempts (key: build-${{ github.sha }})"
            exit 1
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ hashFiles('playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for care backend
        run: bash .github/runner-files/care-backend.sh wait

      - name: Run setup tests (serial)
        run: npx playwright test --project=setup --workers=1
        env:
          NODE_ENV: production
          REACT_CARE_API_URL: ${{ env.REACT_CARE_API_URL }}

      - name: Run Playwright tests (Shard ${{ matrix.shard }}/${{ env.TEST_SHARDS }})
        id: test
        run: npx playwright test --project=chromium --workers=4 --shard=${{ matrix.shard }}/${{ env.TEST_SHARDS }}
        env:
          NODE_ENV: production
          REACT_CARE_API_URL: ${{ env.REACT_CARE_API_URL }}

      - name: Annotate test failure
        if: failure() && steps.test.conclusion == 'failure'
        run: |
          echo "::error::Playwright tests failed in shard ${{ matrix.shard }}/${{ env.TEST_SHARDS }}"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            test-results.json
          retention-days: 7

      - name: Stop backend services
        if: always()
        run: bash .github/runner-files/care-backend.sh stop

  # Aggregate results and create final report
  report:
    if: "!cancelled() && github.repository == 'ohcnetwork/care_fe'"
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check if tests were skipped
        id: skipped
        run: |
          if [ "${{ needs.changes.outputs.tests }}" != "true" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate skipped comment
        if: steps.skipped.outputs.skipped == 'true'
        run: |
          cat > pr-comment.md << 'EOF'
          ## 🎭 Playwright Test Results

          **Status:** ⏭️ Skipped

          No test-related files were changed in this PR.

          Tests are skipped when changes don't affect:
          - `tests/**`
          - `src/**`
          - `package.json`
          - `playwright.config.ts`

          <sub>Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
          EOF

      - name: Download all test results
        if: steps.skipped.outputs.skipped == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-results-shard-*
          path: all-results

      - name: Merge test results
        if: steps.skipped.outputs.skipped == 'false'
        id: merge
        run: |
          TOTAL_TESTS=0
          PASSED_TESTS=0
          FAILED_TESTS=0
          SKIPPED_TESTS=0

          # Parse test results from each shard
          for dir in all-results/playwright-results-shard-*/; do
            if [ -f "$dir/test-results.json" ]; then
              echo "Processing results from $dir"
              # Use jq to parse JSON if available, otherwise use basic parsing
              if command -v jq &> /dev/null; then
                # Count unique tests (including nested test.describe blocks)
                # Use recursive descent to handle nested suites
                SHARD_TOTAL=$(jq '[.. | objects | select(has("tests")) | .tests[]] | length' "$dir/test-results.json")
                SHARD_PASSED=$(jq '[.. | objects | select(has("tests")) | .tests[] | select(.results[-1].status == "passed")] | length' "$dir/test-results.json")
                SHARD_FAILED=$(jq '[.. | objects | select(has("tests")) | .tests[] | select(.results[-1].status == "failed" or .results[-1].status == "timedOut" or .results[-1].status == "interrupted")] | length' "$dir/test-results.json")
                SHARD_SKIPPED=$(jq '[.. | objects | select(has("tests")) | .tests[] | select(.results[-1].status == "skipped")] | length' "$dir/test-results.json")

                TOTAL_TESTS=$((TOTAL_TESTS + SHARD_TOTAL))
                PASSED_TESTS=$((PASSED_TESTS + SHARD_PASSED))
                FAILED_TESTS=$((FAILED_TESTS + SHARD_FAILED))
                SKIPPED_TESTS=$((SKIPPED_TESTS + SHARD_SKIPPED))

                echo "  Shard stats: Total=$SHARD_TOTAL, Passed=$SHARD_PASSED, Failed=$SHARD_FAILED, Skipped=$SHARD_SKIPPED"
              fi
            fi
          done

          echo "total=$TOTAL_TESTS" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED_TESTS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED_TESTS" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED_TESTS" >> "$GITHUB_OUTPUT"

          if [ $FAILED_TESTS -gt 0 ]; then
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=✅ Passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload final report
        if: steps.skipped.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-final-report
          path: all-results/
          retention-days: 14

      - name: Generate PR comment
        if: steps.skipped.outputs.skipped == 'false'
        run: |
          cat > pr-comment.md << 'EOF'
          ## 🎭 Playwright Test Results

          **Status:** ${{ steps.merge.outputs.status }}
          **Test Shards:** ${{ env.TEST_SHARDS }}

          | Metric | Count |
          |--------|-------|
          | Total Tests | ${{ steps.merge.outputs.total }} |
          | ✅ Passed | ${{ steps.merge.outputs.passed }} |
          | ❌ Failed | ${{ steps.merge.outputs.failed }} |
          | ⏭️ Skipped | ${{ steps.merge.outputs.skipped }} |

          📊 Detailed results are available in the [playwright-final-report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) artifact.

          <sub>Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
          EOF

      - name: Upload PR comment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment
          path: pr-comment.md
          retention-days: 1

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr-number
          echo ${{ github.event.pull_request.number }} > pr-number/pr-number.txt

      - name: Upload PR number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number/
          retention-days: 1

      - name: Fail workflow if tests failed
        if: steps.skipped.outputs.skipped == 'false' && needs.test.result == 'failure'
        run: |
          echo "::error::One or more test shards failed"
          exit 1
