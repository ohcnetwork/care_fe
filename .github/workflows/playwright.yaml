name: Playwright Tests

# This workflow runs Playwright E2E tests with backend integration
# - Triggers on push to main branches and PRs
# - Uses path filtering to skip unnecessary runs
# - Runs tests in parallel using 3 shards
# - Provides detailed test reports as artifacts

on:
  pull_request:
    branches:
      - develop
      - production
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "plugins/**"
      - "public/**"
      - ".github/workflows/playwright.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:
  install:
    if: github.repository == 'ohcnetwork/care_fe'
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      REACT_CARE_API_URL: http://localhost:9000
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build application
        run: npm run build

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: build
          retention-days: 1

  # Run E2E tests with backend integration
  parallel-job:
    if: github.repository == 'ohcnetwork/care_fe'
    permissions: write-all
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3]

    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set backend branch
        id: backend-branch
        run: echo "branch=develop" >> $GITHUB_OUTPUT

      - name: Checkout care 📥
        uses: actions/checkout@v4
        with:
          repository: ohcnetwork/care
          path: care
          ref: ${{ steps.backend-branch.outputs.branch }}
          fetch-depth: 0

      - name: Start care docker containers 🐳
        run: |
          cd care
          echo DISABLE_RATELIMIT=True >> docker/.local.env
          echo JWKS_BASE64=\"$(cat ../.github/runner-files/jwks.b64.txt)\" >> docker/.local.env
          echo MAX_QUESTIONNAIRE_TEXT_RESPONSE_SIZE=500 >> docker/.local.env
          make docker_config_file=docker-compose.local.yaml up load-fixtures
          cd ..
        env:
          JWKS_BASE64: ${{ secrets.JWKS_BASE64 }}

      - name: Determine PR Origin
        id: pr_origin
        run: |
          echo "is_forked=$(echo ${{ github.event.pull_request.head.repo.fork }})" >> $GITHUB_OUTPUT

      - name: Download the build folders
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # For non-forked PRs
      - name: "UI Tests - Playwright (Non-forked)"
        if: steps.pr_origin.outputs.is_forked == 'false'
        run: |
          npx vite preview --host &
          echo "Waiting for Vite server to start..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -f -s http://localhost:4000 >/dev/null 2>&1; then
              echo "Vite server is ready!"
              break
            fi
            echo "Server not ready, waiting... ($timeout seconds left)"
            sleep 2
            timeout=$((timeout - 2))
          done
          npx playwright test --shard=${{ matrix.containers }}/3
        env:
          NODE_OPTIONS: --max_old_space_size=1536
          REACT_CARE_API_URL: http://localhost:9000

      # For forked PRs
      - name: "UI Tests - Playwright (Forked)"
        if: steps.pr_origin.outputs.is_forked == 'true'
        run: |
          npx vite preview --host &
          echo "Waiting for Vite server to start..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -f -s http://localhost:4000 >/dev/null 2>&1; then
              echo "Vite server is ready!"
              break
            fi
            echo "Server not ready, waiting... ($timeout seconds left)"
            sleep 2
            timeout=$((timeout - 2))
          done
          npx playwright test --shard=${{ matrix.containers }}/3
        env:
          NODE_OPTIONS: --max_old_space_size=1536
          REACT_CARE_API_URL: http://localhost:9000

      - name: Upload playwright screenshots on failure 📸
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.containers }}
          path: test-results/
          compression-level: 9

      - name: Upload playwright videos 📹
        uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.pr_origin.outputs.is_forked == 'true' }}
        with:
          name: playwright-videos-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.containers }}
          path: test-results/
          compression-level: 9

  cleanup:
    if: always() && github.repository == 'ohcnetwork/care_fe'
    needs: parallel-job
    runs-on: ubuntu-latest
    steps:
      - name: Delete build artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: build
