name: Playwright Tests

# This workflow runs Playwright E2E tests with backend integration
# - Triggers on push to main branches and PRs
# - Uses path filtering to skip unnecessary runs
# - Runs tests in parallel using 3 shards
# - Provides detailed test reports as artifacts

on:
  push:
    branches: [main, develop, production]
  pull_request_target:
    branches: [develop, production]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - ".github/workflows/playwright.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  REACT_CARE_API_URL: http://localhost:9000
  BACKEND_STARTUP_TIMEOUT: 120
  TEST_SHARDS: 3

jobs:
  # Detect if test-related files changed
  changes:
    if: github.repository == 'ohcnetwork/care_fe'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tests:
              - 'tests/**'
              - 'src/**'
              - 'package.json'
              - 'playwright.config.ts'
              - '.github/workflows/**'

  # Build application once and cache for all test shards
  build:
    if: github.repository == 'ohcnetwork/care_fe' && needs.changes.outputs.tests == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build/
            node_modules/
          key: build-${{ github.sha }}

  # Run E2E tests with backend integration
  test:
    if: github.repository == 'ohcnetwork/care_fe' && needs.changes.outputs.tests == 'true'
    needs: [changes, build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4
        with:  
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set backend branch
        id: backend-branch
        run: echo "branch=develop" >> $GITHUB_OUTPUT

      - name: Checkout care 📥
        uses: actions/checkout@v4
        with:
          repository: ohcnetwork/care
          path: care
          ref: ${{ steps.backend-branch.outputs.branch }}
          fetch-depth: 0

      - name: Start care docker containers 🐳
        run: |
          cd care
          echo DISABLE_RATELIMIT=True >> docker/.local.env
          echo JWKS_BASE64=\"$(cat ../.github/runner-files/jwks.b64.txt)\" >> docker/.local.env
          echo MAX_QUESTIONNAIRE_TEXT_RESPONSE_SIZE=500 >> docker/.local.env
          make docker_config_file=docker-compose.local.yaml up load-fixtures
          cd ..
        env:
          JWKS_BASE64: ${{ secrets.JWKS_BASE64 }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restore build cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/
            node_modules/
          key: build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Verify build exists
        run: |
          if [ ! -d "build" ]; then
            echo "::error::Build directory not found. Cache restoration may have failed."
            exit 1
          fi
          echo "Build directory verified ✓"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ hashFiles('playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Shard ${{ matrix.shard }}/${{ env.TEST_SHARDS }})
        id: test
        run: |
          npx playwright test --shard=${{ matrix.shard }}/${{ env.TEST_SHARDS }}
        env:
          NODE_ENV: production
          REACT_CARE_API_URL: ${{ env.REACT_CARE_API_URL }}

      - name: Annotate test failure
        if: failure() && steps.test.conclusion == 'failure'
        run: |
          echo "::error::Playwright tests failed in shard ${{ matrix.shard }}/${{ env.TEST_SHARDS }}"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            test-results.json
          retention-days: 7

      - name: Stop backend services
        if: always()
        run: |
          cd care
          make docker_config_file=docker-compose.local.yaml down || true

  # Aggregate results and create final report
  report:
    if: always() && github.repository == 'ohcnetwork/care_fe' && needs.changes.outputs.tests == 'true'
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-results-shard-*
          path: all-results

      - name: Merge test results
        id: merge
        run: |
          TOTAL_TESTS=0
          PASSED_TESTS=0
          FAILED_TESTS=0
          SKIPPED_TESTS=0

          # Parse test results from each shard
          for dir in all-results/playwright-results-shard-*/; do
            if [ -f "$dir/test-results.json" ]; then
              echo "Processing results from $dir"
              # Use jq to parse JSON if available, otherwise use basic parsing
              if command -v jq &> /dev/null; then
                # Count all test results (including retries)
                SHARD_TOTAL=$(jq '[.suites[].specs[].tests[].results[]] | length' "$dir/test-results.json")
                SHARD_PASSED=$(jq '[.suites[].specs[].tests[].results[] | select(.status == "passed")] | length' "$dir/test-results.json")
                SHARD_FAILED=$(jq '[.suites[].specs[].tests[].results[] | select(.status == "failed" or .status == "timedOut" or .status == "interrupted")] | length' "$dir/test-results.json")
                SHARD_SKIPPED=$(jq '[.suites[].specs[].tests[].results[] | select(.status == "skipped")] | length' "$dir/test-results.json")

                TOTAL_TESTS=$((TOTAL_TESTS + SHARD_TOTAL))
                PASSED_TESTS=$((PASSED_TESTS + SHARD_PASSED))
                FAILED_TESTS=$((FAILED_TESTS + SHARD_FAILED))
                SKIPPED_TESTS=$((SKIPPED_TESTS + SHARD_SKIPPED))

                echo "  Shard stats: Total=$SHARD_TOTAL, Passed=$SHARD_PASSED, Failed=$SHARD_FAILED, Skipped=$SHARD_SKIPPED"
              fi
            fi
          done

          echo "total=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "passed=$PASSED_TESTS" >> $GITHUB_OUTPUT
          echo "failed=$FAILED_TESTS" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED_TESTS" >> $GITHUB_OUTPUT

          if [ $FAILED_TESTS -gt 0 ]; then
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
          else
            echo "status=✅ Passed" >> $GITHUB_OUTPUT
          fi

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-final-report
          path: all-results/
          retention-days: 14

      - name: Create summary JSON
        run: |
          cat > summary.json << EOF
          {
            "status": "${{ steps.merge.outputs.status }}",
            "total": "${{ steps.merge.outputs.total }}",
            "passed": "${{ steps.merge.outputs.passed }}",
            "failed": "${{ steps.merge.outputs.failed }}",
            "skipped": "${{ steps.merge.outputs.skipped }}",
            "shards": "${{ env.TEST_SHARDS }}"
          }
          EOF
          cat summary.json

      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-summary
          path: summary.json
          retention-days: 5

      - name: Add Job Summary
        run: |
          echo "## 🎭 Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.merge.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Shards:** ${{ env.TEST_SHARDS }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | ${{ steps.merge.outputs.total }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${{ steps.merge.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${{ steps.merge.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | ${{ steps.merge.outputs.skipped }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Detailed results are available in the [playwright-final-report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) artifact." >> $GITHUB_STEP_SUMMARY

      # Note: PR comments are now handled by playwright-comment.yaml workflow
      # This prevents "Resource not accessible by integration" errors on fork PRs

      - name: Fail workflow if tests failed
        if: needs.test.result == 'failure'
        run: |
          echo "::error::One or more test shards failed"
          exit 1
