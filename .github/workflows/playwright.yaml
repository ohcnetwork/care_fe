name: Playwright Tests

# This workflow runs Playwright E2E tests with backend integration
# - Triggers on push to main branches and PRs
# - Uses path filtering to skip unnecessary runs
# - Runs tests in parallel using 3 shards
# - Provides detailed test reports as artifacts

on:
  push:
    branches: [main, develop, production, playwright-actions]
  pull_request:
    branches: [develop, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  REACT_CARE_API_URL: http://localhost:9000
  BACKEND_STARTUP_TIMEOUT: 120
  TEST_SHARDS: 3

jobs:
  # Detect if test-related files changed
  changes:
    if: github.repository == 'ohcnetwork/care_fe'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tests:
              - 'tests/**'
              - 'src/**'
              - 'package.json'
              - 'playwright.config.ts'
              - '.github/workflows/playwright.yaml'

  # Build application once and cache for all test shards
  build:
    if: always() && github.repository == 'ohcnetwork/care_fe' && needs.changes.outputs.tests == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build/
            node_modules/
          key: build-${{ github.sha }}

  # Run E2E tests with backend integration
  test:
    if: always() && github.repository == 'ohcnetwork/care_fe' && needs.changes.outputs.tests == 'true'
    needs: [changes, build]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4

      - name: Set backend branch
        id: backend-branch
        run: echo "branch=develop" >> $GITHUB_OUTPUT

      - name: Checkout care 📥
        uses: actions/checkout@v4
        with:
          repository: ohcnetwork/care
          path: care
          ref: ${{ steps.backend-branch.outputs.branch }}

      - name: Start care docker containers 🐳
        run: |
          cd care
          SHARED_CONFIG=$(printf 'DISABLE_RATELIMIT=True\nJWKS_BASE64="%s"\nMAX_QUESTIONNAIRE_TEXT_RESPONSE_SIZE=500\nCORS_ALLOWED_ORIGINS=["http://localhost:4000"]' \
            "$(cat ../.github/runner-files/jwks.b64.txt)")
          printf '%s' "$SHARED_CONFIG" >> docker/.local.env
          printf '%s' "$SHARED_CONFIG" >> docker/.prebuilt.env
          # start pulling backend image and db first to speed up
          docker compose -f docker-compose.yaml -f docker-compose.pre-built.yaml pull backend > /dev/null &
          docker compose -f docker-compose.yaml up -d --wait db > /dev/null
          # load the db dump from the artifact if it exists
          set -e
          {
            archive_download_url=$(curl -sf "https://api.github.com/repos/ohcnetwork/care/actions/artifacts?name=care-db-dump" | jq -r '.artifacts[0].archive_download_url')
            curl -Lf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o care-db-dump.zip "$archive_download_url"
            unzip care-db-dump.zip
            make load-db
            echo "✅ Loaded cached care-db-dump"
            make docker_config_file=docker-compose.pre-built.yaml up || \
            (docker compose -f docker-compose.yaml -f docker-compose.pre-built.yaml logs && false)
          } || {
            echo "⚠️ Failed to load cached care-db-dump, falling back to loading fixtures."
            make docker_config_file=docker-compose.local.yaml up load-fixtures || \
            (docker compose -f docker-compose.yaml -f docker-compose.local.yaml logs && exit 1)
          }
          cd ..
        env:
          JWKS_BASE64: ${{ secrets.JWKS_BASE64 }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restore build cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/
            node_modules/
          key: build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Verify build exists
        run: |
          if [ ! -d "build" ]; then
            echo "::error::Build directory not found. Cache restoration may have failed."
            exit 1
          fi
          echo "Build directory verified ✓"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-${{ hashFiles('playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Shard ${{ matrix.shard }}/${{ env.TEST_SHARDS }})
        id: test
        run: |
          npx playwright test --shard=${{ matrix.shard }}/${{ env.TEST_SHARDS }}
        env:
          NODE_ENV: production
          REACT_CARE_API_URL: ${{ env.REACT_CARE_API_URL }}

      - name: Annotate test failure
        if: failure() && steps.test.conclusion == 'failure'
        run: |
          echo "::error::Playwright tests failed in shard ${{ matrix.shard }}/${{ env.TEST_SHARDS }}"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            test-results.json
          retention-days: 7

  # Aggregate results and create final report
  report:
    if: always() && github.repository == 'ohcnetwork/care_fe'
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check if tests were skipped
        id: skipped
        run: |
          if [ "${{ needs.changes.outputs.tests }}" != "true" ]; then
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate skipped comment
        if: steps.skipped.outputs.skipped == 'true'
        run: |
          cat > pr-comment.md << 'EOF'
          ## 🎭 Playwright Test Results

          **Status:** ⏭️ Skipped

          No test-related files were changed in this PR.

          Tests are skipped when changes don't affect:
          - `tests/**`
          - `src/**`
          - `package.json`
          - `playwright.config.ts`

          <sub>Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
          EOF

      - name: Download all test results
        if: steps.skipped.outputs.skipped == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-results-shard-*
          path: all-results

      - name: Merge test results
        if: steps.skipped.outputs.skipped == 'false'
        id: merge
        run: |
          TOTAL_TESTS=0
          PASSED_TESTS=0
          FAILED_TESTS=0
          SKIPPED_TESTS=0

          # Parse test results from each shard
          for dir in all-results/playwright-results-shard-*/; do
            if [ -f "$dir/test-results.json" ]; then
              echo "Processing results from $dir"
              # Use jq to parse JSON if available, otherwise use basic parsing
              if command -v jq &> /dev/null; then
                # Count unique tests (including nested test.describe blocks)
                # Use recursive descent to handle nested suites
                SHARD_TOTAL=$(jq '[.. | objects | select(has("tests")) | .tests[]] | length' "$dir/test-results.json")
                SHARD_PASSED=$(jq '[.. | objects | select(has("tests")) | .tests[] | select(.results[-1].status == "passed")] | length' "$dir/test-results.json")
                SHARD_FAILED=$(jq '[.. | objects | select(has("tests")) | .tests[] | select(.results[-1].status == "failed" or .results[-1].status == "timedOut" or .results[-1].status == "interrupted")] | length' "$dir/test-results.json")
                SHARD_SKIPPED=$(jq '[.. | objects | select(has("tests")) | .tests[] | select(.results[-1].status == "skipped")] | length' "$dir/test-results.json")
                
                TOTAL_TESTS=$((TOTAL_TESTS + SHARD_TOTAL))
                PASSED_TESTS=$((PASSED_TESTS + SHARD_PASSED))
                FAILED_TESTS=$((FAILED_TESTS + SHARD_FAILED))
                SKIPPED_TESTS=$((SKIPPED_TESTS + SHARD_SKIPPED))
                
                echo "  Shard stats: Total=$SHARD_TOTAL, Passed=$SHARD_PASSED, Failed=$SHARD_FAILED, Skipped=$SHARD_SKIPPED"
              fi
            fi
          done

          echo "total=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "passed=$PASSED_TESTS" >> $GITHUB_OUTPUT
          echo "failed=$FAILED_TESTS" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED_TESTS" >> $GITHUB_OUTPUT

          if [ $FAILED_TESTS -gt 0 ]; then
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
          else
            echo "status=✅ Passed" >> $GITHUB_OUTPUT
          fi

      - name: Upload final report
        if: steps.skipped.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-final-report
          path: all-results/
          retention-days: 14

      - name: Generate PR comment
        if: steps.skipped.outputs.skipped == 'false'
        run: |
          cat > pr-comment.md << 'EOF'
          ## 🎭 Playwright Test Results

          **Status:** ${{ steps.merge.outputs.status }}
          **Test Shards:** ${{ env.TEST_SHARDS }}

          | Metric | Count |
          |--------|-------|
          | Total Tests | ${{ steps.merge.outputs.total }} |
          | ✅ Passed | ${{ steps.merge.outputs.passed }} |
          | ❌ Failed | ${{ steps.merge.outputs.failed }} |
          | ⏭️ Skipped | ${{ steps.merge.outputs.skipped }} |

          📊 Detailed results are available in the [playwright-final-report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) artifact.

          <sub>Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
          EOF

      - name: Upload PR comment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comment
          path: pr-comment.md
          retention-days: 1

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr-number
          echo ${{ github.event.pull_request.number }} > pr-number/pr-number.txt

      - name: Upload PR number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr-number/
          retention-days: 1

      - name: Fail workflow if tests failed
        if: steps.skipped.outputs.skipped == 'false' && needs.test.result == 'failure'
        run: |
          echo "::error::One or more test shards failed"
          exit 1
