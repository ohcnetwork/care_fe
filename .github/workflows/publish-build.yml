name: Publish build bundle

# Publishes the prebuilt `build/` folder as care_fe-build.tar.gz, so static
# hosts can deploy CARE without building it (see docs/prebuilt-bundles.md):
# - ghcr.io/ohcnetwork/care_fe-build:sha-<short sha>, and the branch or tag name
# - an asset of the GitHub release, for tags

on:
  push:
    branches:
      - develop
      - "3.*"
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  NODE_VERSION: "24"
  BUNDLE: ghcr.io/ohcnetwork/care_fe-build

jobs:
  # npm install and build scripts run here, without publishing permissions
  build:
    if: github.repository == 'ohcnetwork/care_fe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Package build
        run: tar -czf care_fe-build.tar.gz -C build .

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: care_fe-build
          path: care_fe-build.tar.gz
          retention-days: 1

  # Signs the bundle with GitHub's own actions only, before publish runs ORAS
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Download bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: care_fe-build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: care_fe-build.tar.gz

      - name: Record digest
        id: digest
        run: echo "sha256=$(sha256sum care_fe-build.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  publish:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: care_fe-build

      - name: Setup ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4

      - name: Push to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras push "$BUNDLE:sha-${GITHUB_SHA::7},${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}" \
            --artifact-type application/vnd.ohcnetwork.care-fe.build.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            care_fe-build.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip

  release:
    needs: [attest, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: care_fe-build

      - name: Check digest
        env:
          SHA256: ${{ needs.attest.outputs.sha256 }}
        run: echo "$SHA256  care_fe-build.tar.gz" | sha256sum -c -

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" care_fe-build.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
