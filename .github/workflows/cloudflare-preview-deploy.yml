name: Deploy PR Preview

on:
  workflow_run:
    workflows: ["Build PR Preview"]
    types: [completed]

concurrency:
  group: cloudflare-preview-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      deployments: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-build
          path: build/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR number
        id: pr
        run: |
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid PR number from workflow payload: $PR_NUMBER" >&2
            exit 1
          fi
          ARTIFACT_PR="$(cat build/pr-number.txt || true)"
          if [[ -n "$ARTIFACT_PR" && "$ARTIFACT_PR" != "$PR_NUMBER" ]]; then
            echo "Artifact PR number mismatch (artifact=$ARTIFACT_PR, payload=$PR_NUMBER)" >&2
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Get PR head SHA
        id: sha
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(process.env.PR_NUMBER, 10),
            });
            return pr.head.sha;
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=pr-${{ steps.pr.outputs.number }} --commit-hash=${{ steps.sha.outputs.result }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        if: steps.deploy.outputs.pages-deployment-alias-url
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const deploymentUrl = process.env.DEPLOYMENT_URL;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);

            // Generate QR code URL for easy mobile access
            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=${encodeURIComponent(deploymentUrl)}`;

            const commentBody = [
              "### 🚀 Preview Deployment Ready!",
              "",
              `**🔗 Preview URL:** ${deploymentUrl}`,
              "",
              "**📱 Mobile Access:**",
              "Scan the QR code below to open the preview on your mobile device.",
              "",
              `![QR Code](${qrCodeUrl})`,
              "",
              "---",
              "*This preview will be automatically updated when you push new commits to this PR.*",
            ].join("\n");

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Preview Deployment Ready')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
