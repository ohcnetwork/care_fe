name: Cypress Tests

on:
  pull_request:
    branches:
      - develop
      - staging
  workflow_dispatch:

jobs:
  prepare-frontend:
    permissions: write-all
    if: github.repository == 'ohcnetwork/care_fe'
    runs-on: ubuntu-latest
    env:
      REACT_CARE_API_URL: http://localhost:9000
      REACT_ENABLED_APPS: "ohcnetwork/care_hcx_fe@main"
      REACT_ENABLE_HCX: true
    outputs:
      is_forked: ${{ steps.pr_origin.outputs.is_forked }}
    steps:
      - name: Checkout 📥
        uses: actions/checkout@v3

      - name: Determine PR Origin
        id: pr_origin
        run: echo "::set-output name=is_forked::$( echo ${{ github.event.pull_request.head.repo.fork }})"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies 📦
        run: npm run install-all

      - name: Build ⚙️
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Cache build output
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-build-${{ github.sha }}

  prepare-backend:
    permissions: write-all
    if: github.repository == 'ohcnetwork/care_fe'
    runs-on: ubuntu-latest
    outputs:
      backend_branch: ${{ steps.backend-branch.outputs.branch }}
      backend_sha: ${{ steps.backend-sha.outputs.sha }}
    steps:
      - name: Set backend branch
        id: backend-branch
        run: |
          if [[ '${{ github.event.pull_request.base.ref }}' == 'staging' ]]; then
            echo "branch=staging" >> $GITHUB_OUTPUT
          else
            echo "branch=develop" >> $GITHUB_OUTPUT
          fi

      - name: Checkout care 📥
        uses: actions/checkout@v3
        with:
          repository: ohcnetwork/care
          path: care
          ref: ${{ steps.backend-branch.outputs.branch }}

      - name: Get backend commit SHA
        id: backend-sha
        run: |
          BACKEND_SHA=$(curl -s "https://api.github.com/repos/ohcnetwork/care/commits/${{ steps.backend-branch.outputs.branch }}" | jq -r .sha)
          echo "sha=$BACKEND_SHA" >> $GITHUB_OUTPUT

      - name: Create cache directory
        run: mkdir -p docker-cache

      - name: Get JWKS file 📥
        uses: actions/checkout@v3
        with:
          repository: ohcnetwork/care_fe
          ref: develop
          sparse-checkout: |
            .github/runner-files/jwks.b64.txt
          sparse-checkout-cone-mode: false

      - name: Restore backend cache
        id: backend-cache
        uses: actions/cache@v3
        with:
          path: docker-cache
          key: ${{ runner.os }}-backend-${{ steps.backend-sha.outputs.sha }}

      - name: Setup backend if cache miss 🐳
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: |
          cd care
          echo DISABLE_RATELIMIT=True >> docker/.prebuilt.env
          echo "CORS_ALLOWED_ORIGINS=\"[\\\"http://localhost:4000\\\"]\"" >> docker/.prebuilt.env
          echo JWKS_BASE64=\"$(cat .github/runner-files/jwks.b64.txt)\" >> docker/.prebuilt.env
          make docker_config_file=docker-compose.pre-built.yaml up 
          make docker_config_file=docker-compose.pre-built.yaml load-dummy-data

          # Export Docker state only on cache miss
          docker pull alpine
          docker save $(docker images -q) > docker-cache/images.tar
          docker run --rm -v /var/lib/docker/volumes/:/volumes -v $(pwd)/docker-cache:/backup alpine tar cvf /backup/volumes.tar /volumes/
        env:
          JWKS_BASE64: ${{ secrets.JWKS_BASE64 }}

      - name: Wait for care to be up ♻
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 1
          max_attempts: 5
          command: curl -o /dev/null -s -w "%{http_code}\n" http://localhost:9000
          on_retry_command: sleep 5

  cypress-run:
    needs:
      - prepare-frontend
      - prepare-backend
    permissions: write-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4]
    env:
      REACT_CARE_API_URL: http://localhost:9000
      REACT_ENABLED_APPS: "ohcnetwork/care_hcx_fe@main"
      REACT_ENABLE_HCX: true
    steps:
      - name: Checkout care 📥
        uses: actions/checkout@v3
        with:
          repository: ohcnetwork/care
          path: care
          ref: ${{ needs.prepare-backend.outputs.backend_branch }}

      - name: Restore Docker cache
        uses: actions/cache@v3
        with:
          path: docker-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}

      - name: Load Docker images
        run: docker load < docker-cache/images.tar || echo "No docker images to restore"

      - name: Restore Docker volumes
        run: |
          sudo mkdir -p /var/lib/docker/volumes/
          sudo docker run --rm -v $(pwd)/docker-cache:/backup -v /var/lib/docker/volumes/:/volumes alpine tar xvf /backup/volumes.tar || echo "No volumes to restore"

      - name: Start backend 🐳
        run: |
          cd care
          echo DISABLE_RATELIMIT=True >> docker/.prebuilt.env
          echo "CORS_ALLOWED_ORIGINS=\"[\\\"http://localhost:4000\\\"]\"" >> docker/.prebuilt.env
          echo JWKS_BASE64=\"$(cat ../.github/runner-files/jwks.b64.txt)\" >> docker/.prebuilt.env
          make docker_config_file=docker-compose.pre-built.yaml up
        env:
          JWKS_BASE64: ${{ secrets.JWKS_BASE64 }}

      - name: Wait for care to be up ♻
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 1
          max_attempts: 5
          command: curl -o /dev/null -s -w "%{http_code}\n" http://localhost:9000
          on_retry_command: sleep 5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore build output
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Install serve
        run: npm install -g serve

      - name: Install Specific Chrome Version
        run: |
          sudo apt-get install -y wget
          sudo wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install ./google-chrome-stable_current_amd64.deb

      - name: Cypress run for Non-Forked PRs 🥬
        if: needs.prepare-frontend.outputs.is_forked == 'false'
        uses: cypress-io/github-action@v5
        with:
          env: SKIP_PREFLIGHT_CHECK=true
          install: false
          start: serve -l 4000 build
          wait-on: "http://localhost:4000"
          wait-on-timeout: 300
          browser: chrome
          record: true
          parallel: true
          group: "UI-Chrome"
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=4096
          COMMIT_INFO_MESSAGE: ${{github.event.pull_request.title}}
          COMMIT_INFO_SHA: ${{github.event.pull_request.head.sha}}

      - name: Cypress run for Forked PRs 🥬
        if: needs.prepare-frontend.outputs.is_forked == 'true'
        uses: cypress-io/github-action@v5
        with:
          env: SKIP_PREFLIGHT_CHECK=true
          install: false
          start: "npx vite preview --host"
          wait-on: "http://localhost:4000"
          wait-on-timeout: 300
          browser: chrome
          record: true
          parallel: true
          group: "UI-Chrome"
        env:
          CYPRESS_SPLIT_TESTS: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=4096
          COMMIT_INFO_MESSAGE: ${{github.event.pull_request.title}}
          COMMIT_INFO_SHA: ${{github.event.pull_request.head.sha}}
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}

      - name: Upload cypress screenshots on failure 📸
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload cypress videos 📹
        uses: actions/upload-artifact@v3
        if: ${{ failure() && needs.prepare-frontend.outputs.is_forked == 'true' }}
        with:
          name: cypress-videos
          path: cypress/videos
