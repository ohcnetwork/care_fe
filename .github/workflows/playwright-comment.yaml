name: Playwright Comment

# This workflow posts/updates PR comments with Playwright test results
# - Runs after "Playwright Tests" workflow completes
# - Works for both internal and fork PRs (fork-safe)
# - Uses workflow_run trigger for proper permissions
# - Upserts comments (create new or update existing)

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.repository == 'ohcnetwork/care_fe'
    steps:
      - name: Download summary artifact
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-summary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Parse summary
        id: parse
        if: steps.download.outcome == 'success'
        run: |
          if [ ! -f summary.json ]; then
            echo "Summary file not found, skipping comment"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Parse JSON with jq
          STATUS=$(jq -r '.status' summary.json)
          TOTAL=$(jq -r '.total' summary.json)
          PASSED=$(jq -r '.passed' summary.json)
          FAILED=$(jq -r '.failed' summary.json)
          SKIPPED=$(jq -r '.skipped' summary.json)
          SHARDS=$(jq -r '.shards' summary.json)

          # Export to outputs
          echo "status=${STATUS}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED}" >> $GITHUB_OUTPUT
          echo "shards=${SHARDS}" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Find PR number
        id: find-pr
        if: steps.parse.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const head_sha = '${{ github.event.workflow_run.head_sha }}';

            // Find PRs associated with this commit
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: head_sha
            });

            if (prs.length > 0) {
              const pr = prs[0]; // Get the first (usually only) PR
              console.log(`Found PR #${pr.number} for commit ${head_sha}`);
              core.setOutput('pr_number', pr.number);
              core.setOutput('found', 'true');
            } else {
              console.log(`No PR found for commit ${head_sha}`);
              core.setOutput('found', 'false');
            }

      - name: Upsert PR comment
        if: steps.find-pr.outputs.found == 'true' && steps.parse.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = ${{ steps.find-pr.outputs.pr_number }};
            const status = '${{ steps.parse.outputs.status }}';
            const total = '${{ steps.parse.outputs.total }}';
            const passed = '${{ steps.parse.outputs.passed }}';
            const failed = '${{ steps.parse.outputs.failed }}';
            const skipped = '${{ steps.parse.outputs.skipped }}';
            const shards = '${{ steps.parse.outputs.shards }}';
            const run_id = '${{ github.event.workflow_run.id }}';
            const run_number = '${{ github.event.workflow_run.run_number }}';
            const run_url = '${{ github.event.workflow_run.html_url }}';

            const body = `## 🎭 Playwright Test Results

            **Status:** ${status}
            **Test Shards:** ${shards}

            | Metric | Count |
            |--------|-------|
            | Total Tests | ${total} |
            | ✅ Passed | ${passed} |
            | ❌ Failed | ${failed} |
            | ⏭️ Skipped | ${skipped} |

            📊 Detailed results are available in the [playwright-final-report](https://github.com/${{ github.repository }}/actions/runs/${run_id}) artifact.

            <sub>Run: [#${run_number}](${run_url})</sub>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## 🎭 Playwright Test Results')
            );

            if (botComment) {
              // Update existing comment
              console.log(`Updating existing comment ${botComment.id}`);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              console.log('Creating new comment');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: body
              });
            }

      - name: Handle missing artifact
        if: steps.download.outcome != 'success'
        run: |
          echo "::warning::Playwright summary artifact not found. This is expected if tests were skipped or if the workflow failed before generating the summary."
