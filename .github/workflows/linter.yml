name: Lint Code Base

on:
  pull_request:
    branches:
      - develop
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint -- --quiet

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run knip
        run: npm run knip
