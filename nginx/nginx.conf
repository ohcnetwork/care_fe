server {
  listen 80;
  root /usr/share/nginx/html;

  # Security headers — mirrors netlify.toml so self-hosted deploys get the
  # same hardening as Netlify deploys. `always` includes error responses.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cdn.ohc.network https://egov-s3-facility-10bedicu.s3.amazonaws.com https://egov-s3-patient-data-10bedicu.s3.amazonaws.com; object-src 'self' https://egov-s3-facility-10bedicu.s3.amazonaws.com https://egov-s3-patient-data-10bedicu.s3.amazonaws.com" always;

  include mime.types;
  types {
    text/javascript js mjs;
  }

  location = /index.html {
    expires 6h;
  }

  location / {
    expires 7d;
    try_files $uri $uri/ /index.html;
  }
}
