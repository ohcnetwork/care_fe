<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Display Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .badge-container-old {
            overflow: hidden;
        }
        .badge-container-new {
            /* No overflow hidden */
        }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-sm mx-auto bg-white rounded-lg shadow">
        <div class="p-4">
            <h2 class="text-lg font-semibold mb-4">Badge Display Test - Galaxy Z Fold 5 (344px)</h2>
            
            <div class="mb-6">
                <h3 class="text-md font-medium mb-2 text-red-600">BEFORE: With overflow-hidden (problematic)</h3>
                <div class="flex grow flex-col min-w-0 overflow-hidden">
                    <h4 class="truncate text-base font-semibold">Bed Block</h4>
                    <p class="text-sm text-gray-500 truncate">Building</p>
                    <div class="mt-2 flex flex-wrap gap-2 badge-container-old">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 whitespace-nowrap">Active</span>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 whitespace-nowrap">Available</span>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800 border border-gray-300 whitespace-nowrap overflow-hidden gap-1">
                            <svg class="size-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v4"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 5v4"></path>
                            </svg>
                            Has child locations
                        </span>
                    </div>
                </div>
            </div>
            
            <div>
                <h3 class="text-md font-medium mb-2 text-green-600">AFTER: Without overflow-hidden (fixed)</h3>
                <div class="flex grow flex-col min-w-0">
                    <h4 class="truncate text-base font-semibold">Bed Block</h4>
                    <p class="text-sm text-gray-500 truncate">Building</p>
                    <div class="mt-2 flex flex-wrap gap-2 badge-container-new">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 whitespace-nowrap">Active</span>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 whitespace-nowrap">Available</span>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800 border border-gray-300 whitespace-nowrap gap-1">
                            <svg class="size-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5v4"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 5v4"></path>
                            </svg>
                            Has child locations
                        </span>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 text-xs text-gray-500">
                Viewport: 344px × 882px (Galaxy Z Fold 5)
            </div>
        </div>
    </div>
</body>
</html>
